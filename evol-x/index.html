<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>evol-x GYM · Nos mudamos</title>
<script>
// La app de Ivonne sigue aquí mientras tanto: sus usuarias pasan directo a ivonne.html
(function(){
  try {
    var w = (location.hostname + location.pathname + location.search).toLowerCase();
    var esIvonne = w.indexOf('ivonne') >= 0 || localStorage.getItem('app_marca') === 'ivonne' || !!localStorage.getItem('iw_db_v1');
    if (esIvonne) location.replace('ivonne.html' + (location.search || '?marca=ivonne'));
  } catch (e) {}
})();
</script>
<style>
  :root{--bg:#090d14;--card:#0c1a2e;--acc:#00d4f5;--txt:#f0f8ff;--gris:#8aa6c1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
  .c{max-width:440px;width:100%;background:var(--card);border:1px solid rgba(0,212,245,.25);border-radius:18px;padding:32px 24px;text-align:center}
  .logo{font-size:40px;font-weight:800;letter-spacing:1px}.logo span{color:var(--acc)}
  .gym{letter-spacing:8px;color:var(--gris);font-size:12px;margin-bottom:22px}
  h1{font-size:20px;margin:0 0 10px}
  p{color:var(--gris);line-height:1.6;margin:0 0 18px;font-size:15px}
  a.b{display:inline-block;background:var(--acc);color:#000;font-weight:700;text-decoration:none;padding:13px 22px;border-radius:12px}
  small{display:block;margin-top:18px;color:var(--gris);font-size:12px}
</style>
</head>
<body>
<div class="c">
  <div class="logo">evol<span>-x</span></div>
  <div class="gym">G Y M</div>
  <h1>🛠️ Estamos mejorando la app</h1>
  <p>La app de evol-x tiene nueva casa, más rápida y más segura. Desde ahora entra por:</p>
  <a class="b" href="https://evolxgym.com/app/">evolxgym.com/app</a>
  <small>Entra con tu mismo usuario y contraseña. Si aún no abre, estamos terminando la mudanza: inténtalo en un rato.</small>
</div>
</body>
</html>
